  <!-- Preconnect for faster resource loading -->

</head>
<body>

      projects.forEach(({ href, image, title, year }) => {
        const link = document.createElement("a");
        link.href = href;
        link.className = "project-box";
        link.innerHTML = `
          <img loading="lazy" src="${image}" alt="${title}" width="400" height="300" sizes="(max-width: 600px) 100vw, (max-width: 1024px) 50vw, 33vw" />
          <div class="overlay">
            <h3>${title}</h3>
            <p class="year">${year}</p>
          </div>
        `;
        list.appendChild(link);
      });
